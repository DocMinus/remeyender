[project]
name = "remeyender"
version = "0.1.2"
description = "Simple app for taking a break and if just for a few moments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[tool.uv]
# uv's own Python includes tkinter; some distro Pythons (e.g. Ubuntu's) don't.
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
]
