name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # rebuild an existing tag, e.g. to add a platform to a release that already exists
    inputs:
      tag:
        description: "Existing tag to build"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # Git Bash on Windows, so the commands below work everywhere
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --locked

      - name: Build (macOS .app)
        if: matrix.name == 'macos'
        run: |
          uv run pyinstaller --windowed --name RemEYEnder --noconfirm \
            --icon icons/RemEYEnder.icns \
            --add-data icons/RemEYEnder.png:icons --add-data icons/RemEYEnder-small.png:icons \
            main.py

      - name: Build (Windows single file)
        if: matrix.name == 'windows'
        run: |
          uv run pyinstaller --onefile --windowed --name RemEYEnder --noconfirm \
            --icon icons/RemEYEnder.ico \
            --add-data icons/RemEYEnder.png:icons --add-data icons/RemEYEnder-small.png:icons \
            main.py

      - name: Build (Linux single file)
        if: matrix.name == 'linux'
        # PyInstaller doesn't find uv's bundled Tcl/Tk libraries on its own (see INSTALL.md)
        run: |
          TCLTK="$(uv run python -c 'import sys; print(sys.base_prefix)')/lib"
          uv run pyinstaller --onefile --windowed --name RemEYEnder --noconfirm \
            --add-data icons/RemEYEnder.png:icons --add-data icons/RemEYEnder-small.png:icons \
            --add-binary "$TCLTK/libtcl9.0.so:." --add-binary "$TCLTK/libtcl9tk9.0.so:." \
            main.py

      - name: Package (macOS)
        if: matrix.name == 'macos'
        # ditto keeps the .app bundle's symlinks and permissions intact; plain zip can break them
        run: ditto -c -k --keepParent dist/RemEYEnder.app RemEYEnder-${{ env.TAG }}-macos.zip

      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: 7z a RemEYEnder-${{ env.TAG }}-windows.zip ./dist/RemEYEnder.exe

      - name: Package (Linux)
        if: matrix.name == 'linux'
        # tar keeps the executable bit; a zip would lose it. UNTESTED until run on a real desktop.
        run: |
          cp icons/remeyender.desktop icons/RemEYEnder.png dist/
          tar czf RemEYEnder-${{ env.TAG }}-linux-UNTESTED.tar.gz -C dist RemEYEnder remeyender.desktop RemEYEnder.png

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: RemEYEnder-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release, or add missing builds to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if existing=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' 2>/dev/null); then
            for f in artifacts/*; do
              grep -qxF "$(basename "$f")" <<<"$existing" || gh release upload "$TAG" "$f" --repo "$REPO"
            done
          else
            gh release create "$TAG" artifacts/* \
              --repo "$REPO" \
              --title "RemEYEnder $TAG" \
              --generate-notes
          fi
